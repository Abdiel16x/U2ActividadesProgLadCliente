<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5. Lista de tareas</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background-color: gainsboro;
            font-family: Arial;
        }

        h1 {
            text-align: center;
            font-size: 2em;
            background-color: darkblue;
            font-weight: 300;
            margin: 0;
            padding: 10px;
            color: whitesmoke;
        }

        form {
            width: 50%;
            display: grid;
            margin: 10px auto;
            grid-template-columns: 4fr 1fr 1fr 3fr;
            grid-template-rows: repeat(5, auto);
            gap: 10px;
        }

        label {
            grid-column: span 4;
            font-size: 1.5em;
        }

        input[type=button] {
            background-color: darkblue;
            color: whitesmoke;
            height: 30px;
        }

        input[type=text] {
            grid-column: span 3;
            font-size: 1.5em;
        }

        select {
            grid-row: span 4;
            font-size: 1.5em;
        }

        #select2 {
            grid-column: 3 / 5;
            grid-row: 3 / 7;
        }
    </style>
</head>

<body>

    <h1>Ejercicio 5. Lista de tareas</h1>

    <form>
        <label for="txtTexto">Elemento:</label>
        <input type="text" id="txtTexto">
        <input type="button" value="Agregar" id="btnAgregar">
        <select size="10" id="select1"></select>
        <input type="button" id="btnDer" value=">>">
        <input type="button" id="btnIzq" value="<<">
        <input type="button" id="btnBorrar" value="&#128473;">
        <select size="10" id="select2"></select>
    </form>

    <script>
        const txtDato = document.querySelector("#txtTexto");
        const btnAgregar = document.getElementById("btnAgregar");
        const selector = document.querySelectorAll("select");
        const btnDerecha = document.getElementById("btnDer");
        const btnIzquierda = document.getElementById("btnIzq");
        const btnBorrar = document.getElementById("btnBorrar");
        btnAgregar.addEventListener("click", () => {
            //validar que reciba el texto
            const texto = txtDato.value.trim();
            //No se dupliquen
            if (texto != "") {
                const selector1 = Array.from(selector[0]);
                const selector2 = Array.from(selector[1]);

                if (!selector1.some(x => x.value == texto) 
                && !selector2.some(x=> x.value == texto)) {
                    //crear de manera manual una opcion
                    const op = document.createElement("option");
                    op.textContent = texto;
                    //agregarlo al dom
                    selector[0].append(op);
                    txtDato.focus();
                    txtDato.value = "";
                }
            }

            //a la opcion darle el texto con textcontext

            //agregar

        });
        btnDerecha.addEventListener("click", () => {
            if (selector[0].selectedIndex >= 0) {
                //a traves del indice
                const elemento = selector[0].options[selector[0].selectedIndex];
                selector[1].append(elemento);
            }
        });
        btnIzquierda.addEventListener("click", () => {
            if (selector[1].selectedIndex >= 0) {
                const elemento = selector[1].options[selector[1].selectedIndex];
                selector[0].append(elemento);
            }
        });
        btnBorrar.addEventListener("click", () => {
            if (selector[0].selectedIndex >= 0) {
                selector[0].options[selector[0].selectedIndex].remove();
            }
            if (selector[1].selectedIndex >= 0) {
                selector[1].options[selector[1].selectedIndex].remove();
            }
        })
    </script>
</body>

</html>
