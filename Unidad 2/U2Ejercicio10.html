<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <title>Ejercicio </title>
    <style>
        body {
            font-family: Verdana;
            background: #1e1e2f;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
        }

        p {
            font-size: 20px;
        }

        h1 {
            font-size: 50px;
        }

        .tablero {
            display: grid;
            grid-template-columns: repeat(5, 80px);
            grid-template-rows: repeat(5, 80px);
            gap: 10px;
            margin: 20px 0;
        }

        .celda {
            width: 80px;
            height: 80px;
            background-color: #444;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .celda.encendida {
            background-color: #f1c40f;
            box-shadow: 0 0 15px #f1c40f;
        }

        button {
            padding: 10px 20px;
            font-size: 25px;
            background: red;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Lights Out </h1>
    <p id="mensaje">¡Apaga todas las luces!</p>
    <div id="tablero" class="tablero"></div>
    <button id="btnReiniciar">Reiniciar Juego</button>

    <script>
        //crear el arreglo
        const btnReiniciar = document.getElementById("btnReiniciar");
        const tablero = document.getElementById("tablero");
        let luces = Array(25).fill(0);

        const iniciarJuego = () => {
            luces = luces.map(l => Math.random() > 0.5 ? 1 : 0);
            renderizarTablero();
        }

        btnReiniciar.addEventListener("click", iniciarJuego);
        const cambiarLuz = (indice) => {
            const renglon = Math.floor(indice / 5);
            const columna = indice % 5;

            luces[indice] = luces[indice] == 1 ? 0 : 1;

            if (columna > 5) {
                luces[indice - 1] = luces[indice - 1] === 0 ? 1 : 0;
            }

            if (columna < 4) {
                luces[indice + 1] = luces[indice + 1] === 0 ? 1 : 0;
            }

            if (renglon > 0) {
                luces[indice - 5] = luces[indice - 5] === 0 ? 1 : 0;
            }
            if (renglon < 4) {
                luces[indice + 5] = luces[indice + 5] === 0 ? 1 : 0;
            }
            renderizarTablero();

            let gano = luces.every(x=> x == 0);
            if (gano === true) {
                alert("Juego ganado");
            }
        }

        const renderizarTablero = () => {
            tablero.innerHTML = "";

            //dibujar los if a traves del foreach

            luces.forEach((l, indice) => {
                const div = document.createElement("div");
                div.classList.add("celda");

                //evento clic del div
                div.classList.add(l === 1 ? "encendida" : "celda");
                div.addEventListener("click", () => cambiarLuz(indice));

                tablero.append(div);
            });


            iniciarJuego();
        }

    </script>
</body>
